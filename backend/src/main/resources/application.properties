spring.application.name=twofold-backend

# Render (and most PaaS hosts) inject PORT and terminate TLS at the proxy.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true

# POST /api/reset wipes every table. It is a development tool, so it is OFF
# unless a deployment explicitly opts in: `scripts/dev.mjs` starts the API with
# TWOFOLD_RESET_ENABLED=true, and the test suite sets the property itself.
# A misconfigured deploy therefore answers 403 instead of exposing a data wipe.
twofold.reset.enabled=false
